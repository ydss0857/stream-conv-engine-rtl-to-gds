# LibreLane configuration: conv_engine hardened as a macro on SkyWater sky130.
#
#   cd asic/conv_engine
#   librelane config.yaml                    # sky130A, sky130_fd_sc_hd (defaults)
#
# Same RTL as the FPGA build; only the line-buffer depth differs. In standard
# cells every line-buffer bit is a flip-flop plus read-mux logic, so the first
# run uses MAX_WIDTH = 128 (2 x 128 x 8 = 2,048 storage flops). The PPA study
# sweeps this parameter.

DESIGN_NAME: conv_engine
VERILOG_FILES:
  - dir::../../rtl/conv_engine.v
  - dir::../../rtl/conv_regs.v
  - dir::../../rtl/axis_skid.v
  - dir::../../rtl/luma_axis.v
  - dir::../../rtl/conv_window.v
  - dir::../../rtl/line_ram.v
  - dir::../../rtl/conv_datapath.v
  - dir::../../rtl/mul_u8s8.v
SYNTH_PARAMETERS:
  - MAX_WIDTH=128
  - AW=7

CLOCK_PORT: aclk
# Sign-off target from the requirement, not an arbitrary number: 720p60 needs a
# 74.25 MHz pixel clock (~74.4 MHz with the engine's flush cycles), so close
# 80 MHz at every corner including ss/100C/1.60V. Runs v1-v3 used 10 ns.
CLOCK_PERIOD: 12.5          # ns -> 80 MHz

FP_CORE_UTIL: 40            # % of core area filled by cells after placement

# Runs v1/v2: the resizer used clkdlybuf4s25_1 (a slow delay cell, ~1.3-1.5 ns
# each at the ss corner) as fanout and input buffers; four in series on the
# line-buffer read-address net were the worst setup path. Exclude them; hold
# repair still has dlygate4sd* / dlymetal6s* delay cells.
EXTRA_EXCLUDED_CELLS:
  - sky130_fd_sc_hd__clkdlybuf4s*

# Run v3: repair sized buffers at the typical corner with a 10-20 % margin, so
# at ss (about 2x slower) thousands of pins exceeded max slew (2.07 ns vs
# 0.75 ns). Repair with more margin and buffer long wires.
DESIGN_REPAIR_MAX_SLEW_PCT: 50
DESIGN_REPAIR_MAX_CAP_PCT: 40
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 40
DESIGN_REPAIR_MAX_WIRE_LENGTH: 400
